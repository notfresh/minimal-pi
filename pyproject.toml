[project]
name = "minimal-pi"
version = "0.1.0"
description = "Pi agent harness 的最小蒸馏版（v1）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
]

[project.scripts]
minimal-pi = "minimal_pi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minimal_pi"]